# Managed file. Edit it in sirloinbh/project-standards templates/infra/.github/workflows/
# Calls the central shared CI (reusable-infra-ci) pinned to the central commit that was synced. It does not run terraform apply.
name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    uses: sirloinbh/project-standards/.github/workflows/reusable-infra-ci.yml@354d413af53a9073b0fab9671de269c25d080a93
    with:
      terraform-version: '1.16.5'
      node-version: '24.21.0'
