# 중앙 관리 파일. 수정은 sirloinbh/project-standards의 templates/infra/.github/workflows/에서
# 중앙 공통 CI(reusable-infra-ci)를 동기화한 중앙 커밋으로 고정해 호출한다. terraform apply는 하지 않는다.
name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    uses: sirloinbh/project-standards/.github/workflows/reusable-infra-ci.yml@c96579243e212b5fcc24b74961256ac7e73173de
    with:
      terraform-version: '1.16.5'
      node-version: '24.21.0'
