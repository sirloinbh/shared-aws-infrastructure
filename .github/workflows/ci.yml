# Managed file. Edit it in sirloinbh/project-standards templates/infra/.github/workflows/
# Calls the central shared CI (reusable-infra-ci) pinned to the central commit that was synced. It does not run terraform apply.
name: ci

on: [push, pull_request]

permissions:
  contents: read

# A new push to a pull request branch cancels that branch's older run. A run on main is never cancelled:
# autodeploy treats a cancelled run of a commit as a failure, so main runs get a group of their own (#873).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: sirloinbh/project-standards/.github/workflows/reusable-infra-ci.yml@9594400325f502e9bd144a0f9831bf7390cee544
    with:
      terraform-version: '1.16.5'
      node-version: '24.21.0'
